<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Mi Amor Café</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.21.0/dist/jquery.validate.min.js"></script>
</head>

<body class="login-page">

    <main class="page-container">

        <section class="login-card">

            <header class="brand-header">
                <h1>MI AMOR CAFÉ</h1>
                <p>Made with love, served with warmth.</p>
            </header>

            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Start your cozy morning with us.</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="login-email">Username</label>

                    <input
                        type="text"
                        id="login-email"
                        name="username"
                        placeholder="Enter your username">
                </div>

                <div class="form-group">
                    <label for="login-password">Password</label>

                    <input
                        type="password"
                        id="login-password"
                        name="password"
                        placeholder="Enter your password">
                </div>

                <div class="form-options">

                    <label class="remember-me">
                        <input
                            type="checkbox"
                            name="remember">
                        Remember me
                    </label>

                    <a href="#">Forgot password?</a>

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p class="account-link">
                Don't have an account?
                <a href="register.html">Register</a>
            </p>

        </section>

    </main>

    <script>

        $(document).ready(function () {

            $("#loginForm").validate({

                rules: {

                    username: {
                        required: true
                    },

                    password: {
                        required: true
                    }

                },

                messages: {

                    username: {
                        required: "Please enter your username."
                    },

                    password: {
                        required: "Please enter your password."
                    }

                },

                submitHandler: function (form) {

                    const registeredUsername =
                        localStorage.getItem("registeredUsername");

                    const registeredPassword =
                        localStorage.getItem("registeredPassword");

                    const enteredUsername =
                        $("#login-email").val();

                    const enteredPassword =
                        $("#login-password").val();


                    if (
                        enteredUsername === registeredUsername &&
                        enteredPassword === registeredPassword
                    ) {
                        sessionStorage.setItem(
                            "loggedInUser",
                            enteredUsername
                        );

                        window.location.href = "index.html";

                    } else {

                        alert(
                            "Invalid username or password. Please try again."
                        );

                    }

                }

            });

        });

    </script>

</body>

</html>
